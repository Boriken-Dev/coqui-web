[package]
name = "coqui-web-channel"
version = "0.0.0-alpha.0"
description = "Deprecated: re-exports coqui-transport and coqui-transport-web, where this crate's code moved"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-web-channel"
keywords = ["webtransport", "websocket", "deprecated"]
categories = ["network-programming", "web-programming::websocket"]
exclude = [".*", "*.local.*", "/tools/"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Each forwards to the feature of the same name in `coqui-transport-web`.
websocket = ["coqui-transport-web/websocket"]
webtransport = ["coqui-transport-web/webtransport"]
webrtc = ["coqui-transport-web/webrtc"]

[dependencies]
# The code that moved. The family has no releases for now: its crates depend on each other by git revision.
coqui-transport-web = { git = "https://github.com/Boriken-Dev/coqui-transport-web", rev = "a423f0e090b65b70d1bb9d8c2ddc834db4cf8624" }
coqui-transport = { git = "https://github.com/Boriken-Dev/coqui-transport", rev = "82563e2282149e543b95cc1dd00fbafc3bfcdf52", default-features = false }

[dev-dependencies]
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
url = "2.5"
time = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
wtransport = { version = "0.7.2", default-features = false, features = ["quinn", "ring"] }
# The tests that forge STUN, and count QUIC address tokens as a consumer with quinn's default `bloom` would see them.
hmac = "0.12"
sha1 = "0.10"
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["bloom"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
# The old tests name these directly: they were this crate's optional dependencies, which a test can use.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }

[[test]]
name = "ladder"
required-features = ["webrtc"]

[[test]]
name = "ladder_idle"
required-features = ["webrtc"]

[[test]]
name = "ladder_peers"
required-features = ["webrtc"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
